name: Build OmniPlayer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build self-contained Windows app
        run: dotnet publish src/OmniPlayer.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath OmniPlayer-win-x64.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniPlayer-win-x64
          path: OmniPlayer-win-x64.zip

      - name: Publish as the "latest" release download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest OmniPlayer-win-x64.zip \
            --title "OmniPlayer (latest build)" \
            --notes "Download **OmniPlayer-win-x64.zip**, unzip it anywhere, and run **OmniPlayer.exe**. Built from commit ${GITHUB_SHA::7}." \
            --target "$GITHUB_SHA" --latest
